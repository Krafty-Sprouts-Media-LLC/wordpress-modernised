name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} / ${{ matrix.db.image }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']
        db:
          - { image: 'mysql:8.4', connection: mysql, port: 3306, health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot' }
          - { image: 'mysql:9.7', connection: mysql, port: 3306, health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot' }
          - { image: 'mariadb:11.8', connection: mariadb, port: 3306, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { image: 'mariadb:12.3', connection: mariadb, port: 3306, health: 'healthcheck.sh --connect --innodb_initialized' }
          - { image: 'postgres:18', connection: pgsql, port: 5432, health: 'pg_isready -U wordpress -d wordpress' }
        include:
          - php: '8.4'
            db: { image: 'mysql:9.7', connection: mysql, port: 3306, health: 'mysqladmin ping -h 127.0.0.1 -uroot -proot' }

    services:
      database:
        image: ${{ matrix.db.image }}
        ports:
          - ${{ matrix.db.port }}:${{ matrix.db.port }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
          MYSQL_USER: wordpress
          MYSQL_PASSWORD: wordpress
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wordpress
          MARIADB_USER: wordpress
          MARIADB_PASSWORD: wordpress
          POSTGRES_USER: wordpress
          POSTGRES_PASSWORD: wordpress
          POSTGRES_DB: wordpress
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      DB_CONNECTION: ${{ matrix.db.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.db.port }}
      DB_DATABASE: wordpress
      DB_USERNAME: wordpress
      DB_PASSWORD: wordpress

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Create the test databases (MySQL, MariaDB)
        if: matrix.db.connection != 'pgsql'
        run: mysql --protocol=tcp -h 127.0.0.1 -P 3306 -uroot -proot < compose/init.sql

      - name: Create the test databases (PostgreSQL)
        if: matrix.db.connection == 'pgsql'
        run: PGPASSWORD=wordpress psql -h 127.0.0.1 -p 5432 -U wordpress -d wordpress -f compose/init-postgres.sql

      - name: Cache WordPress tests
        uses: actions/cache@v6
        with:
          path: conformance/wordpress-develop
          key: wordpress-develop-7.1.4-${{ hashFiles('conformance/fetch-wordpress-tests.php') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate

      - name: App tests
        run: php artisan test

      - name: Fetch WordPress tests
        run: composer conformance:fetch

      - name: WordPress checker
        run: composer conformance
